# Sourced by armbian-firstlogin on the first root login (the framework
# copies this file to /root/.not_logged_in_yet, whose existence triggers
# the interactive wizard). Set PRESET_* variables here to make it
# non-interactive, e.g.:
#   PRESET_USER_NAME=pi
#   PRESET_USER_PASSWORD=raspberry
#   PRESET_DEFAULT_REALNAME=Clover2
# (the pi user is already pre-created at image build time by the
# clover2-user-setup extension, so the wizard's user step is redundant)
