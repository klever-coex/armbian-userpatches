name: Build images for Clover2 (VM)

on:
  workflow_dispatch:
    inputs:
      clover2_dev_ref:
        description: "clover2_dev tag/commit/branch (empty = pinned default)"
        required: false
        default: "75f9d54a71cbd554b398dacc23730574a344ab29" # feature/tooling HEAD
      upload_s3:
        description: "Upload artifacts to S3"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.clover2_dev_ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            config: clover2-vm-amd64
            arch: amd64
            publish: false
          - runs-on: ubuntu-24.04-arm
            config: clover2-vm-arm64
            arch: arm64
            publish: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy userpatches for builder
        run: |
          mkdir -p custom/userpatches
          cp -r _config*.conf config* extensions firstboot* systemd udev motd sudoers \
                libcamera-debian overlay custom/userpatches/

      - name: Restore clover2 build cache
        uses: actions/cache/restore@v5
        with:
          path: build/cache/clover2
          key: clover2-${{ matrix.arch }}-${{ hashFiles('libcamera-debian/**', 'extensions/clover2/clover2-libcamera.sh') }}
          restore-keys: |
            clover2-${{ matrix.arch }}-

      - uses: ./.github/actions/armbian-build
        id: armbian
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: "${{ matrix.config }}"
          armbian_runner_clean: "yes" # recommended for Github runners

          armbian_branch: v26.11.0-trunk.54
          armbian_kernel_ref: tag:v6.18.52

      - name: Save clover2 build cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: build/cache/clover2
          key: clover2-${{ matrix.arch }}-${{ hashFiles('libcamera-debian/**', 'extensions/clover2/clover2-libcamera.sh') }}

      - name: Install clover2 CLI
        if: inputs.upload_s3
        uses: klever-coex/clover2-cli@v0.0.6
        with:
          detect-version: ""

      - name: Checkout version source repository
        if: inputs.upload_s3
        uses: actions/checkout@v7
        with:
          repository: klever-coex/clover2-dev
          ref: ${{ inputs.clover2_dev_ref }}
          fetch-depth: 0
          path: version-src

      - name: Compose version and channel
        id: version
        if: inputs.upload_s3
        shell: bash
        run: |
          set -euo pipefail
          cd version-src
          ref="${{ inputs.clover2_dev_ref }}"
          args=()
          if [[ "$ref" == refs/tags/* || "$ref" == v* ]]; then
            args+=(--ref "$ref")
          fi
          meta="$(clover2 version compose "${args[@]}" --json)"
          echo "$meta"
          {
            echo "version=$(jq -r .version <<<"$meta")"
            echo "build_mode=$(jq -r .build_mode <<<"$meta")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: inputs.upload_s3
        uses: klever-coex/ci/.github/actions/artifact-push@master
        env:
          HTTP_PROXY: &proxy_url http://proxyuser:${{ secrets.PROXY_PASSWORD }}@${{ secrets.PROXY_IP }}
          HTTPS_PROXY: *proxy_url
        with:
          artifacts: ${{ steps.armbian.outputs.armbian_artifacts }}/*.{qcow2,ova}
          product: simulator
          platform: ${{ matrix.arch }}
          version: ${{ steps.version.outputs.version }}
          build-mode: ${{ steps.version.outputs.build_mode }}
          sha: ${{ github.sha }}
          type: "image"
          s3-endpoint: ${{ secrets.MINIO_ENDPOINT }}
          s3-access-key: ${{ secrets.MINIO_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.MINIO_SECRET_KEY }}

      - name: Telegram notify
        if: always()
        uses: klever-coex/ci/.github/actions/release-notify@master
        with:
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat: ${{ secrets.TELEGRAM_TO }}
          kind: build
          status: ${{ job.status }}
          project: armbian-userpatches
          ref: ${{ matrix.config }}
          extra: >-
            image: ${{ matrix.config }} ·
            clover2-dev @ ${{ inputs.clover2_dev_ref }}${{ inputs.upload_s3 && ' · uploaded to S3' || '' }}
