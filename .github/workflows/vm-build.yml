name: Build images for Clover2 (VM)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      clover2_dev_ref:
        description: "clover2_dev tag/commit/branch (empty = pinned default)"
        required: false
        default: ""
      upload_s3:
        description: "Upload artifacts to S3"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.clover2_dev_ref }}
  cancel-in-progress: true

# permissions:
#   contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            config: clover2-vm-amd64
            arch: amd64
            publish: false
          - runs-on: ubuntu-24.04-arm
            config: clover2-vm-arm64
            arch: arm64
            publish: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy userpatches for builder
        run: |
          mkdir -p custom/userpatches
          cp -r _config*.conf config* extensions firstboot* systemd udev motd sudoers \
                libcamera-debian overlay custom/userpatches/

      # - name: Restore clover2 build cache
      #   uses: actions/cache/restore@v5
      #   with:
      #     path: build/cache/clover2
      #     key: clover2-${{ matrix.arch }}-${{ hashFiles('libcamera-debian/**', 'extensions/clover2-libcamera.sh', 'extensions/clover2-vscodium.sh') }}
      #     restore-keys: |
      #       clover2-${{ matrix.arch }}-

      - uses: ./.github/actions/armbian-build
        id: armbian
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: "${{ matrix.config }}"
          armbian_runner_clean: "yes" # recommended for Github runners

          # upstream commit the extensions and prebuilt kernel are validated against
          armbian_branch: v26.11.0-trunk.54 # upstream master the extensions are validated against
          armbian_kernel_ref: tag:v6.18.52

          armbian_extra_args: >-
            CLOVER2_DEV_COMMIT=${{ inputs.clover2_dev_ref }}

      # - name: Save clover2 build cache
      #   uses: actions/cache/save@v5
      #   if: always()
      #   with:
      #     path: build/cache/clover2
      #     key: clover2-${{ matrix.arch }}-${{ hashFiles('libcamera-debian/**', 'extensions/clover2-libcamera.sh', 'extensions/clover2-vscodium.sh') }}

      - name: Upload img to S3
        if: >-
          ${{
            (github.event_name == 'push' || github.event_name == 'release' ||
             github.event_name == 'workflow_dispatch' ||
             github.event_name == 'repository_dispatch')
            && (github.event_name != 'workflow_dispatch' || inputs.upload_s3)
            && github.event_name != 'pull_request'
          }}
        run: |
          aws s3 sync "${{ steps.armbian.outputs.armbian_artifacts }}" \
            "s3://clover-vm/${{ matrix.config }}/${{ github.run_id }}/" \
            --acl public-read --no-progress
          for artifact in "${{ steps.armbian.outputs.armbian_artifacts }}"/*; do
            [[ -f "$artifact" ]] || continue
            echo "Uploaded https://clover-vm.s3.cloud.ru/${{ matrix.config }}/${{ github.run_id }}/$(basename "$artifact")"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-central-1

      # - name: Publish GitHub release
      #   if: >-
      #     ${{
      #       github.event_name == 'repository_dispatch'
      #       && matrix.publish
      #       && steps.ref.outputs.ref != ''
      #     }}
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     TAG: "${{ steps.ref.outputs.ref }}+img"
      #     PRERELEASE: "${{ github.event.client_payload.prerelease }}"
      #   run: |
      #     set -euo pipefail
      #     args=(--title "clover2 ${TAG} images")
      #     [[ "${PRERELEASE}" == "true" ]] && args+=(--prerelease)
      #     gh release create "${TAG}" "${args[@]}" \
      #       --notes "Images built from clover2 ${{ steps.ref.outputs.ref }} (${{ matrix.config }})" \
      #       || echo "release already exists, uploading into it"
      #     gh release upload "${TAG}" \
      #       "${{ steps.armbian.outputs.armbian_artifacts }}"/* --clobber
