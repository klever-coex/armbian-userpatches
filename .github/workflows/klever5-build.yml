name: Build images for Klever5 (rpi)

on:
  workflow_dispatch:
    inputs:
      clover2_ref:
        description: "clover2 tag/commit/branch (empty = pinned default)"
        required: false
        default: ""
      upload_s3:
        description: "Upload artifacts to S3"
        type: boolean
        default: true
  repository_dispatch:
    types: [clover2-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.client_payload.tag || github.run_id }}
  cancel-in-progress: true

env:
  CLOVER2_PIN: "7ecac13f009048510a8323ce4e7d5f839477ed8a"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
            config: klever5-rpi5b
            board: rpi5b
            arch: arm64
            publish: true
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve clover2 ref
        id: ref
        run: |
          set -euo pipefail
          ref="${{ github.event.client_payload.tag }}"
          if [[ -z "${ref}" && "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.clover2_ref }}"
          fi
          if [[ -z "${ref}" ]]; then
            ref="${{ env.CLOVER2_PIN }}" # pinned default = same ref the build uses
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Building clover2 @ ${ref:-<pinned default>}"

      - name: Copy userpatches for builder
        run: |
          mkdir -p custom/userpatches
          cp -r _config*.conf config* extensions firstboot* systemd udev motd \
                sudoers libcamera-debian libcamera-deb hailo overlay custom/userpatches/

      - name: Restore clover2 build cache
        uses: actions/cache/restore@v5
        with:
          path: build/cache/clover2
          key: clover2-${{ matrix.arch }}-${{ hashFiles('libcamera-debian/**', 'extensions/drivers/libcamera.sh') }}
          restore-keys: |
            clover2-${{ matrix.arch }}-

      - name: Restore prebuilt artifacts cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/output/packages-hashed
            build/output/debs
            build/cache/rootfs
          key: artifacts-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            artifacts-${{ matrix.config }}-

      - uses: ./.github/actions/armbian-build
        id: armbian
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: "${{ matrix.config }}"
          armbian_runner_clean: "yes" # recommended for Github runners

          armbian_branch: v26.11.0-trunk.54
          armbian_kernel_ref: commit:2212a454d11b24d171a818fdd709adb4b339ca1f

          armbian_extra_args: >-
            CLOVER2_COMMIT=${{ steps.ref.outputs.ref }}

      - name: Save clover2 build cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: build/cache/clover2
          key: clover2-${{ matrix.arch }}-${{ hashFiles('libcamera-debian/**', 'extensions/drivers/libcamera.sh') }}

      - name: Save prebuilt artifacts cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            build/output/packages-hashed
            build/output/debs
            build/cache/rootfs
          key: artifacts-${{ matrix.config }}-${{ github.sha }}

      - name: Install clover2 CLI
        if: github.event_name == 'repository_dispatch' || inputs.upload_s3
        uses: klever-coex/clover2-cli@v0.0.6
        with:
          detect-version: ""

      - name: Checkout version source repository
        if: github.event_name == 'repository_dispatch' || inputs.upload_s3
        uses: actions/checkout@v7
        with:
          repository: klever-coex/clover2
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: version-src

      - name: Compose version and channel
        id: version
        if: github.event_name == 'repository_dispatch' || inputs.upload_s3
        shell: bash
        run: |
          set -euo pipefail
          cd version-src
          ref="${{ steps.ref.outputs.ref }}"
          args=()
          if [[ "$ref" == refs/tags/* || "$ref" == v* ]]; then
            args+=(--ref "$ref")
          fi
          meta="$(clover2 version compose "${args[@]}" --json)"
          echo "$meta"
          {
            echo "version=$(jq -r .version <<<"$meta")"
            echo "build_mode=$(jq -r .build_mode <<<"$meta")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: github.event_name == 'repository_dispatch' || inputs.upload_s3
        uses: klever-coex/ci/.github/actions/artifact-push@master
        with:
          artifacts: ${{ steps.armbian.outputs.armbian_artifacts }}/*.zip
          product: klever5
          platform: ${{ matrix.board }}
          version: ${{ steps.version.outputs.version }}
          build-mode: ${{ steps.version.outputs.build_mode }}
          sha: ${{ github.sha }}
          type: "image"
          s3-endpoint: ${{ secrets.MINIO_ENDPOINT }}
          s3-access-key: ${{ secrets.MINIO_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.MINIO_SECRET_KEY }}

      - name: Telegram notify
        if: always()
        uses: klever-coex/ci/.github/actions/release-notify@master
        with:
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat: ${{ secrets.TELEGRAM_TO }}
          kind: build
          status: ${{ job.status }}
          project: armbian-userpatches
          ref: ${{ matrix.config }}
          extra: >-
            image: ${{ matrix.config }} (${{ matrix.arch }}) ·
            clover2 @ ${{ steps.ref.outputs.ref }}${{ inputs.upload_s3 && ' · uploaded to S3' || '' }}
