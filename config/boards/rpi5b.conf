# Clover2 — Raspberry Pi 5B (BCM2712); the rpi kernel tree in the bcm2711
# family covers Pi 4 and Pi 5 alike, armbian has no separate bcm2712 family
declare -g BOARD_NAME="Clover2 RPi 5B"
declare -g BOARD_VENDOR="Clover2"
declare -g BOARDFAMILY="bcm2711"
declare -g BOARD_MAINTAINER="matveylapin"
declare -g INTRODUCED="2026"
declare -g KERNEL_TARGET="current,edge,legacy"
declare -g ASOUND_STATE="asound.state.rpi"
declare -g MODULES="i2c_dev"
